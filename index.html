  function enterChat() {
    setMode('chat');
    input.value = '';
    chatBusy = false;
    chatExitArmed = false;
    chatLoadGen++;   /* ignore any in-flight session load from a previous view */
    if (chatAbort) { chatAbort.abort(); chatAbort = null; }
    document.body.classList.add('chat-open');
    chatView.hidden = false;
    /* replace the right sync indicator with the send arrow */
    syncIconEl.style.display = 'none';
    chatSendBtn.hidden = false;
    chatSendBtn.disabled = true;
    updateChatSendState();
    /* fresh thread + refresh the session sidebar */
    chatSessionId = null;
    chatMessagesList = [];
    chatLoading = false;   /* a fresh thread shows the welcome, not a spinner */
    renderChatMessages();
    loadChatSessions();
    input.focus();
  }
  function exitChat() {
    chatExitArmed = false;
    chatBusy = false;
    chatLoadGen++;
    if (chatAbort) { chatAbort.abort(); chatAbort = null; }
    setMode('command');
    document.body.classList.remove('chat-open');
    chatView.hidden = true;
    chatSidebar.classList.remove('open');
    chatSidebarOpen = false;
    chatSidebarToggle.setAttribute('aria-expanded', 'false');
    chatSendBtn.hidden = true;
    input.value = '';
    /* restore the sync indicator the chat bar hid (local mode: permanent warn) */
    if (window.__startSync && window.__startSync.resurfaceIcon) { window.__startSync.resurfaceIcon(); }
  }
  function enterChatExit() {
    chatExitArmed = true;
    input.value = '';
    input.placeholder = 'Salir del chat… (x)';
    chatIndicator.hidden = true;
    cmdIndicator.hidden = false;
  }
  function cancelChatExit() {
    chatExitArmed = false;
    chatIndicator.hidden = false;
    cmdIndicator.hidden = true;
    input.placeholder = 'Pregunta algo...';
  }
  function updateChatSendState() {
    if (!chatSendBtn) return;
    chatSendBtn.disabled = !input.value.trim() || chatBusy;
  }
  function scrollChatBottom() { chatMessages.scrollTop = chatMessages.scrollHeight; }
  function appendChatNotice(text) {
    var el = document.createElement('div');
    el.className = 'msg-error';
    el.textContent = text;
    chatMessages.appendChild(el);
    scrollChatBottom();
  }

  /* --- session sidebar --- */
  function setChatSidebar(open) {
    chatSidebarOpen = !!open;
    chatSidebar.classList.toggle('open', chatSidebarOpen);
    chatSidebarToggle.setAttribute('aria-expanded', chatSidebarOpen ? 'true' : 'false');
    /* the mobile drawer's grey scrim follows the sidebar open state */
    if (chatSidebarBackdrop) {
      chatSidebarBackdrop.classList.toggle('open', chatSidebarOpen);
      chatSidebarBackdrop.setAttribute('aria-hidden', chatSidebarOpen ? 'false' : 'true');
    }
  }
  function toggleChatSidebar() { setChatSidebar(!chatSidebarOpen); }
  /* Start a fresh thread: clear the current session selection, fold the
     sidebar, and show the 'Think before you ask.' welcome. Any still-streaming
     send/regenerate is aborted so it can't write into the cleared thread. */
  function startNewChat() {
    /* New chat always opens a blank thread: abort any still-streaming send or
       regenerate so it can't keep writing into the thread we're about to clear. */
    if (chatAbort) { chatAbort.abort(); chatAbort = null; }
    chatBusy = false;
    chatSessionId = null;
    chatMessagesList = [];
    chatLoading = false;   /* a new thread shows the welcome, not a spinner */
    chatExitArmed = false;
    chatLoadGen++;
    setChatSidebar(false);
    renderChatMessages();
    renderChatSessionList();
    loadChatSessions();
    input.value = '';
    updateChatSendState();
    input.focus();
  }
  function loadChatSessions() {
    var access = window.__startChatAccess;
    if (!access || !access.token()) { chatSessions = []; renderChatSessionList(); return; }
    fetch(access.base + '/api/chat-sessions', {
      headers: { 'Authorization': 'Bearer ' + access.token() }
    }).then(function (r) {
      if (!r.ok) throw new Error('http_' + r.status);
      return r.json();
    }).then(function (data) {
      chatSessions = (data.sessions || []);
      renderChatSessionList();
    }).catch(function () { chatSessions = []; renderChatSessionList(); });
  }
  function renderChatSessionList() {
    chatSessionList.textContent = '';
    if (!chatSessions.length) {
      var empty = document.createElement('div');
      empty.className = 'chat-session-empty';
      empty.textContent = 'Aún no hay sesiones.';
      chatSessionList.appendChild(empty);
      return;
    }
    var now = Date.now();
    var today = startOfDay(now);
    var yesterday = startOfDay(now - 86400000);
    var week = startOfDay(now - 6 * 86400000);
    var groups = [
      { label: 'Hoy', items: [] },
      { label: 'Ayer', items: [] },
      { label: 'Esta semana', items: [] },
      { label: 'Anteriores', items: [] }
    ];
    chatSessions.forEach(function (s) {
      var t = Number(s.updated_at) || 0;
      if (t >= today) { groups[0].items.push(s); }
      else if (t >= yesterday) { groups[1].items.push(s); }
      else if (t >= week) { groups[2].items.push(s); }
      else { groups[3].items.push(s); }
    });
    groups.forEach(function (g) {
      if (!g.items.length) return;
      var lab = document.createElement('div');
      lab.className = 'chat-session-group';
      lab.textContent = g.label;
      chatSessionList.appendChild(lab);
      g.items.forEach(function (s) {
        var item = document.createElement('div');
        item.className = 'chat-session-item' + (s.id === chatSessionId ? ' active' : '');
        item.setAttribute('role', 'listitem');
        item.setAttribute('tabindex', '0');
        item.textContent = s.title || s.last_message || 'Sesión';
        item.title = s.title || '';
        item.addEventListener('mousedown', function (ev) { ev.preventDefault(); openChatSession(s.id); });
        /* keyboard access: Enter / Space opens the session */
        item.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openChatSession(s.id); }
        });
        chatSessionList.appendChild(item);
      });
    });
  }
  function openChatSession(id) {
    if (!id) return;
    var access = window.__startChatAccess;
    if (!access || !access.token()) { appendChatNotice('Sin conexión con la API.'); return; }
    var gen = ++chatLoadGen;   /* stale responses from an older selection are ignored */
    chatSessionId = id;
    chatMessagesList = [];
    chatLoading = true;        /* show a spinner while fetching — NOT the new-thread welcome */
    chatExitArmed = false;
    renderChatMessages();
    renderChatSessionList();
    fetch(access.base + '/api/chat-messages?session=' + encodeURIComponent(id), {
      headers: { 'Authorization': 'Bearer ' + access.token() }
    }).then(function (r) {
      if (!r.ok) throw new Error('http_' + r.status);
      return r.json();
    }).then(function (data) {
      if (gen !== chatLoadGen) return;   /* a newer selection superceded this one */
      chatLoading = false;
      chatMessagesList = (data.messages || []).map(function (m) {
        return { id: m.id, role: m.role, content: m.content, created_at: Number(m.created_at), streaming: false };
      });
      renderChatMessages();
      renderChatSessionList();
      scrollChatBottom();
    }).catch(function () {
      if (gen === chatLoadGen) {
        chatLoading = false;
        renderChatMessages();
        appendChatNotice('No se pudo cargar la sesión.');
      }
    });
  }

  /* --- message rendering + actions --- */
  function renderChatMessages() {
    chatMessages.textContent = '';
    if (chatLoading) {
      var load = document.createElement('div');
      load.className = 'chat-loading';
      load.innerHTML = '<div class="spinner" aria-hidden="true"></div>';
      chatMessages.appendChild(load);
      return;
    }
    if (!chatMessagesList.length) {
      var empty = document.createElement('div');
      empty.className = 'chat-empty';
      /* the 'Think before you ask.' block-art welcome (a <template>, cloned) */
      var tpl = document.getElementById('chatEmptyArt');
      if (tpl && tpl.content && tpl.content.cloneNode) {
        empty.appendChild(tpl.content.cloneNode(true));
      } else {
        empty.textContent = 'Pregunta algo...';
      }
      chatMessages.appendChild(empty);
      return;
    }
    chatMessagesList.forEach(function (m) { chatMessages.appendChild(buildMessageEl(m)); });
  }
  function buildMessageEl(m) {
    var wrap = document.createElement('div');
    wrap.className = 'chat-msg ' + (m.role === 'user' ? 'user' : 'assistant');
    var bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    if (m.streaming && !m.content) { bubble.textContent = '…'; }
    else { bubble.innerHTML = blockMd(m.content); }
    wrap.appendChild(bubble);
    var actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.appendChild(actionBtn(SVG_COPY, 'Copiar', function () { copyMessage(m.content); }));
    actions.appendChild(actionBtn(SVG_TRASH, 'Eliminar', function () { deleteMessage(m); }));
    if (m.role === 'assistant' && !m.streaming) {
      actions.appendChild(actionBtn(SVG_REGEN, 'Regenerar', function () { regenerateMessage(m); }));
    }
    wrap.appendChild(actions);
    return wrap;
  }
  function actionBtn(svg, label, onClick) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'msg-action';
    btn.title = label;
    btn.setAttribute('aria-label', label);
    btn.innerHTML = svg;
    btn.addEventListener('click', onClick);

  }
  function copyMessage(text) {

      navigator.clipboard.writeText(text).catch(function () {});
    } else if (document.execCommand) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
  }
  function deleteMessage(m) {
    var access = window.__startChatAccess;
    if (!access || !access.token()) return;
    fetch(access.base + '/api/chat-messages?id=' + encodeURIComponent(m.id), {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + access.token() }
    }).then(function (r) {
      /* only drop the bubble once the server confirms the delete */
      if (!r.ok) { appendChatNotice('No se pudo eliminar el mensaje.'); return; }
      var idx = chatMessagesList.indexOf(m);
      if (idx !== -1) { chatMessagesList.splice(idx, 1); }
      renderChatMessages();
      loadChatSessions();
    }).catch(function () { appendChatNotice('No se pudo eliminar el mensaje.'); });
  }

  /* --- streaming a conversation turn (send + regenerate) --- */
  function consumeChatStream(reader, onEvent) {
    var decoder = new TextDecoder();
    var buf = '';
    function handleLine(line) {
      line = line.trim();
      if (!line) return;
      var obj;
      try { obj = JSON.parse(line); } catch (e) { return; }
      if (obj && obj.type) { onEvent(obj); }
    }
    function step() {
      return reader.read().then(function (r) {
        if (r.done) { if (buf.trim()) handleLine(buf.trim()); return; }
        buf += decoder.decode(r.value, { stream: true });
        var idx;
        while ((idx = buf.indexOf('\n')) !== -1) {
          var line = buf.slice(0, idx); buf = buf.slice(idx + 1);
          handleLine(line);
        }
        return step();
      });
    }
    return step();
  }

  function sendChatMessage() {
    if (mode !== 'chat' || chatBusy) return;
    var text = input.value.trim();
    if (!text) return;
    var access = window.__startChatAccess;
    if (!access || !access.token()) {
      appendChatNotice('El chat necesita el inicio de sesión: introduce tu contraseña.');
      return;
    }
    chatBusy = true;
    updateChatSendState();
    var userMsg = { id: 'local-' + Date.now(), role: 'user', content: text, created_at: Date.now(), streaming: false };
    chatMessagesList.push(userMsg);
    renderChatMessages();
    scrollChatBottom();
    input.value = '';
    updateChatSendState();
    chatAbort = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    fetch(access.base + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + access.token() },
      body: JSON.stringify({ sessionId: chatSessionId, message: text }),
      signal: chatAbort ? chatAbort.signal : undefined
    }).then(function (r) {
      if (!r.ok) throw new Error('http_' + r.status);
      return r.body.getReader();
    }).then(function (reader) {
      return consumeChatStream(reader, function (obj) {
        if (obj.type === 'meta') {
          chatSessionId = obj.sessionId;
          if (obj.userMessageId) { userMsg.id = obj.userMessageId; }
          /* insert a placeholder assistant bubble that receives deltas */
          chatMessagesList.push({ id: obj.assistantMessageId, role: 'assistant', content: '', created_at: Date.now(), streaming: true });
          renderChatMessages();
          scrollChatBottom();
        } else if (obj.type === 'delta') {
          var last = chatMessagesList[chatMessagesList.length - 1];
          if (last && last.streaming) { last.content += obj.text; renderChatMessages(); scrollChatBottom(); }
        } else if (obj.type === 'done') {
          var l = chatMessagesList[chatMessagesList.length - 1];
          if (l && l.streaming) { l.streaming = false; }
          chatBusy = false;
          updateChatSendState();
          renderChatMessages();
          loadChatSessions();
        } else if (obj.type === 'error') {
          var l2 = chatMessagesList[chatMessagesList.length - 1];
          if (l2 && l2.streaming) { chatMessagesList.pop(); }
          appendChatNotice('La IA no pudo responder. Comprueba AI_MODEL y AI_API_KEY.');
          chatBusy = false;
          updateChatSendState();
          renderChatMessages();
          loadChatSessions();
        }
      });
    }).catch(function (err) {
      /* a deliberate abort (user exited chat / started a new one) is silent */
      if (err && err.name === 'AbortError') {
        chatBusy = false;
        updateChatSendState();
        renderChatMessages();
        return;
      }
      appendChatNotice('No se pudo enviar. Comprueba tu conexión.');
      chatBusy = false;
      updateChatSendState();
      renderChatMessages();
    });
  }

  function regenerateMessage(m) {
    if (chatBusy || !chatSessionId || !m.id) return;
    var access = window.__startChatAccess;
    if (!access || !access.token()) return;
    var original = m.content;   /* keep the stored reply; restore it on failure */
    chatBusy = true;
    updateChatSendState();
    m.content = '';
    m.streaming = true;
    renderChatMessages();
    scrollChatBottom();
    chatAbort = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    fetch(access.base + '/api/chat-messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + access.token() },
      body: JSON.stringify({ sessionId: chatSessionId, assistantMessageId: m.id }),
      signal: chatAbort ? chatAbort.signal : undefined
    }).then(function (r) {
      if (!r.ok) throw new Error('http_' + r.status);
      return r.body.getReader();
    }).then(function (reader) {
      return consumeChatStream(reader, function (obj) {
        if (obj.type === 'delta') { m.content += obj.text; renderChatMessages(); scrollChatBottom(); }
        else if (obj.type === 'done') {
          m.streaming = false; chatBusy = false; updateChatSendState(); renderChatMessages(); loadChatSessions();
        } else if (obj.type === 'error') {
          m.content = original; m.streaming = false; chatBusy = false;
          updateChatSendState(); renderChatMessages(); appendChatNotice('No se pudo regenerar.'); loadChatSessions();
        }
      });
    }).catch(function (err) {
      if (err && err.name === 'AbortError') {
        m.content = original; m.streaming = false; chatBusy = false;
        updateChatSendState(); renderChatMessages();
        return;
      }
      m.content = original; m.streaming = false; chatBusy = false;
      updateChatSendState(); renderChatMessages();
      appendChatNotice('No se pudo regenerar.');
    });
  }

  chatSidebarToggle.addEventListener('click', toggleChatSidebar);
  chatNewBtn.addEventListener('click', startNewChat);
  chatSendBtn.addEventListener('click', function () { sendChatMessage(); input.focus(); });
  /* tapping the mobile drawer scrim folds the sidebar */
  if (chatSidebarBackdrop) {
    chatSidebarBackdrop.addEventListener('click', function () { setChatSidebar(false); });
  }

  input.addEventListener('input', function () {
    var v = input.value;
    var c = v.toLowerCase();   /* commands are case-insensitive */
    if (mode === 'chat') {
      /* typing `/` arms exit, `x` confirms; any other char cancels it */
      if (chatExitArmed) {
        if (c === 'x') { exitChat(); return; }
        cancelChatExit();
      } else if (v === '/') {
        enterChatExit();
        return;
      }
      updateChatSendState();
      return;
    }
    if (mode === 'url' || mode === 'search') {
      if (c === 'aaa' || c === '/' || c === '-') { enterCmd(); }
      else if (mode === 'url') { updateHistoryMenu(); }
      return;
    }
    if (mode === 'command') { handleCommandKey(c); return; }
    if (mode === 'timer') {
      /* countdown value: digits and colons only; anything else is a typo —
         leave timer mode keeping the text in the selected top mode */
      if (!/^[0-9:]*$/.test(v)) exitToTop();
      return;
    }
    if (mode === 'settings') { handleSettingsKey(c); return; }
    if (mode === 'links') { handleLinksKey(c); return; }
    if (mode === 'timers') { handleTimersKey(c); return; }
  });

  /* Backspace on an empty prompt goes one layer up: links -> settings ->
     command -> top; Escape climbs the same stack at any time and cancels a
     bookmark prompt mid-typing. Keys 1-9 open the pinned links ONLY while
     the bar is focused in COMMAND mode (no modifiers, no repeat). In
     url/search/settings the digits type into the bar normally. */
  input.addEventListener('keydown', function (e) {
    /* chat mode: Escape only cancels a pending `/x` exit; it never climbs a
       mode stack or clears the message draft. */
    if (mode === 'chat') {
      if (e.key === 'Escape') {
        if (chatExitArmed) { cancelChatExit(); }
        e.preventDefault();
        return;
      }
    }
    /* url mode with the history dropdown open: arrows move the highlight,
       Enter opens the highlighted row (row 0 = "Abrir este URL…" opens the
       typed text — but only when the typed text is a valid URL; for garbage
       the action row is omitted and row 0 is the first match), `d` deletes a
       highlighted history entry, Escape closes the menu. */
    if (mode === 'url' && !historyMenu.hidden) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveHistoryIndex(1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); moveHistoryIndex(-1); return; }
      /* the action row occupies row 0 only when the typed text is a valid URL */
      var offset = actionOpenable() ? 1 : 0;
      if (e.key === 'Enter') {
        /* Row 0 is the "Abrir este URL…" action (when present); any other
           highlighted row is a history entry. */
        if (historyIndex === 0 && offset) { e.preventDefault(); openUrl(); }
        else if (matches[historyIndex - offset]) { e.preventDefault(); selectHistory(matches[historyIndex - offset]); }
        return;
      }
      if ((e.key === 'd' || e.key === 'D') && !e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat) {
        /* delete the highlighted history entry; on the action row the key
           types into the bar normally (filtering the list). Modifier
           combos (Ctrl+D bookmark, Alt+D address bar) and held-key
           repeats are never hijacked. */
        if (historyIndex >= offset && matches[historyIndex - offset]) {
          e.preventDefault();
          deleteHistory(matches[historyIndex - offset]);
        }
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); hideHistoryMenu(); return; }
    }
    /* timers manager dropdown: arrows move the highlight and show the selected timer (only when not mid-prompt) */
    if (mode === 'timers' && !promptState && !timerMenu.hidden) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveTimerIndex(1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); moveTimerIndex(-1); return; }
    }
    if (e.key === 'Escape' && (mode === 'command' || mode === 'settings' ||
                               mode === 'links' || mode === 'timers' ||
                               mode === 'timer')) {
      e.preventDefault();
      if (promptState) { cancelPrompt(); }
      else if (mode === 'links') { enterSettings(); }
      else if (mode === 'timers') { enterSettings(); }
      else if (mode === 'settings') { enterCmd(); }
      else if (mode === 'command') { exitToTop(); }
      else if (mode === 'timer') { enterCmd(); }
      return;
    }
    if (mode === 'command' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat && isDigitKey(e.key)) {
      e.preventDefault();
      openPinned(Number(e.key));
      return;
    }
    if (e.key !== 'Backspace' || input.value !== '') return;
    if (mode === 'links') {
      e.preventDefault();
      if (promptState) { cancelPrompt(); }
      else { enterSettings(); }
    }
    else if (mode === 'timers') {
      e.preventDefault();
      if (promptState) { cancelPrompt(); }
      else { enterSettings(); }
    }
    else if (mode === 'settings') {
      e.preventDefault();
      if (promptState) { cancelPrompt(); }
      else { enterCmd(); }
    }
    else if (mode === 'command') { e.preventDefault(); exitToTop(); }
    else if (mode === 'timer') { e.preventDefault(); enterCmd(); }
  });

  /* Clicking anywhere else (or tabbing out) closes the dropdown. Item
     selection uses mousedown + preventDefault, so it keeps the input focus
     and blur never races the pick. */
  input.addEventListener('blur', function () { hideHistoryMenu(); updateTimerMenu(); });
  input.addEventListener('focus', function () { updateTimerMenu(); });

  /* ---------- global shortcuts (bar NOT focused) ---------- */
  /* After clicking a bookmark link or anywhere else, the bar loses focus and
     keys do nothing. These page-level shortcuts only fire when NO editable
     element is focused (typed keys still go to the bar or any other editable
     element normally). Modifier combos (ctrl/meta/alt) are never hijacked. */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    /* while in chat mode the page-level shortcuts (a/s/t/c/k/z/r/x/digits)
       must not hijack keys — chat owns the keyboard here */
    if (mode === 'chat') return;
    /* Never hijack keys while ANY editable element has focus — not just the
       search bar (a textarea or contenteditable could be added later). */
    var ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
    var k = e.key.toLowerCase();
    if (k === 'a') {
      /* activate the url/search bar, keeping the current top mode */
      e.preventDefault();
      input.focus();
    } else if (k === '/' || k === '-') {
      e.preventDefault();
      enterCmd();
      input.focus();
    } else if (k === 's') {
      e.preventDefault();
      enterSettings();
      input.focus();
    } else if (k === 't') {
      /* the active timer comes back on display (no focus steal, like c/k);
         with no active timer, enter timer setup like `s` enters settings */
      e.preventDefault();
      var act = getActive();
      if (act) { showTimer(act); }
      else { enterTimer(); input.focus(); }
    } else if (k === 'c') {
      e.preventDefault();
      toggleClock();
    } else if (k === 'k') {
      e.preventDefault();
      toggleTheme();
    } else if (k === 'z') {
      /* pause/resume the active timer (bring it forward like `t` for feedback) */
      var tz = getActive();
      if (tz) { e.preventDefault(); showTimer(tz); togglePause(tz); }
    } else if (k === 'r') {
      /* reset the active timer (bring it forward like `t` for feedback) */
      var tr = getActive();
      if (tr) { e.preventDefault(); showTimer(tr); resetTimer(tr); }
    } else if (k === 'x') {
      /* delete the active timer (confirm s/y); enter command mode for the prompt */
      if (getActive()) { e.preventDefault(); enterCmd(); deleteActiveTimer(); input.focus(); }
    } else if (isDigitKey(k)) {
      /* 1-9 open the pinned links */
      e.preventDefault();
      openPinned(Number(k));
    }
  });

  form.addEventListener('submit', function (e) {
    if (mode === 'chat') { e.preventDefault(); sendChatMessage(); return; }
    if (mode === 'url') { e.preventDefault(); openUrl(); return; }
    if (mode === 'timer') { e.preventDefault(); commitTimer(); return; }
    if (mode === 'links') {
      e.preventDefault();
      if (promptState) { commitPrompt(); }
      else { exitToTop(); input.value = ''; }
      return;
    }
    if (mode === 'timers') {
      e.preventDefault();
      if (promptState) { commitPrompt(); }
      else if (timers.length) { startTimerAt(timerIndex); }
      else { exitToTop(); input.value = ''; }
      return;
    }
    if (mode === 'command' || mode === 'settings') {
      /* Enter during a prompt commits it; otherwise (empty bar or any
         Enter in a sub-mode) returns to the top */
      e.preventDefault();
      if (promptState) { commitPrompt(); }
      else { exitToTop(); input.value = ''; }
      return;
    }
    /* search mode: results open in a new tab, so clear the input for the next query;
       defer so the submitted query is not affected */
    var eng = ENGINES[engine];
    if (eng && eng.url) {
      /* path-based engine (RAE Diccionario del Estudiante): the query lives
         in the URL path (…/diccionario-estudiante/{q}), which a native GET
         form can't express — build the URL and open it directly */
      e.preventDefault();
      window.open(eng.url.replace('{q}', encodeURIComponent(input.value.trim())),
                  '_blank', 'noopener');
    }
    setTimeout(function () { input.value = ''; }, 0);
  });
})();
</script>
<script>
/* ---------- sync (auth + cross-device settings) ----------
   The page is local-first: it renders from localStorage exactly as before.
   This module only adds a one-time password gate per device, a pull of the
   settings from the DB after auth (last-write-wins by timestamp), and a
   debounced push of every save()/timer-stop. If the API is unreachable the
   page keeps working with local state; the next change or reload retries. */
(function () {
  'use strict';

  /* Page and API are same-origin on Vercel (start.lqh2011.com and the
     preview alias), so the API is reached by relative path — no CORS, no
     separate API host, single-origin standard architecture. */
  var API_BASE = '';

  /* Device-specific keys (theme) are intentionally NOT listed: start.theme
     stays in localStorage only, so each device keeps its own light/dark/
     system choice. */
  var SYNC_KEYS = ['start.mode', 'start.engine', 'start.clock',
                   'start.timers', 'start.timerActive', 'start.timerVisible',
                   'start.timerHours', 'start.bookmarks', 'start.history'];
  var TOKEN_KEY = 'start.token';
  var TS_KEY = 'start.sync.ts';   /* key -> ms of the value in localStorage */

  var overlay = document.getElementById('authOverlay');
  var authForm = document.getElementById('authForm');
  var passInput = document.getElementById('authPassword');
  var authError = document.getElementById('authError');
  var main = document.querySelector('main');
  var localBanner = document.getElementById('localBanner');

  /* Local mode (no backend): logging in with the password `local`, `test` or
     `debug` skips the API entirely — there is no token, no pull and no push.
     Everything stays in localStorage (the page is already local-first), and
     the mode is remembered across reloads via start.localMode so the overlay
     doesn't come back. A banner + a permanent warning icon mark the mode. */
  var LOCAL_KEY = 'start.localMode';
  var LOCAL_PASSWORDS = ['local', 'test', 'debug'];

  var token = null;
  var readyToPush = false;
  var pushTimer = null;
  var interacted = false;
  /* lastKnown[key] = the value we believe is current (local or pulled).
     save() with an identical value is a no-op restore, not a user change —
     it must not bump the timestamp or trigger a push. */
  var lastKnown = {};
  SYNC_KEYS.forEach(function (k) { lastKnown[k] = lsGet(k); });

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function readTs() { try { return JSON.parse(lsGet(TS_KEY) || '{}'); } catch (e) { return {}; } }
  function writeTs(map) { lsSet(TS_KEY, JSON.stringify(map)); }

  /* ---------- sync status indicator (typing bar) ---------- */
  /* A small icon on the right of the search bar reflects the sync state: a
     spinning cycle-arrow while a pull is in flight, then a tick (success) or
     a warning (failure) that flashes for a moment and disappears. It shows on
     the first load (and on the manual `p` pull / post-auth sync), and never
     blocks typing (pointer-events:none). */
  var syncIcon = document.getElementById('syncIcon');
  var syncLoading = syncIcon.querySelector('.sync-loading');
  var syncOk = syncIcon.querySelector('.sync-ok');
  var syncWarn = syncIcon.querySelector('.sync-warn');
  var syncFlashTimer = null;
  /* Monotonic generation for pulls: each syncFromServer call bumps it, and a
     pull only drives the indicator if it is still the LATEST pull when it
     finishes — so an earlier pull's result can't hide the spinner/flash over a
     later pull still in flight. */
  var syncGen = 0;
  /* Show exactly one child icon (or none) and show/hide the container. The
     icon container starts `hidden` (display:none via the UA [hidden] rule);
     once a sync runs we drive display via inline style so the per-state icon
     reliably paints (the `hidden` attribute is unreliable on <svg>). */
  function showSyncIcon(state) {
    if (syncFlashTimer) { clearTimeout(syncFlashTimer); syncFlashTimer = null; }
    syncLoading.style.display = (state === 'loading') ? 'block' : 'none';
    syncOk.style.display = (state === 'ok') ? 'block' : 'none';
    syncWarn.style.display = (state === 'warn') ? 'block' : 'none';
    syncIcon.style.display = state ? 'flex' : 'none';
  }
  /* Briefly flash an ok/warn result, then hide the icon. */
  function flashSyncResult(state) {
    showSyncIcon(state);
    if (syncFlashTimer) { clearTimeout(syncFlashTimer); }
    syncFlashTimer = setTimeout(function () { syncIcon.style.display = 'none'; }, 1200);
  }

  /* ---------- overlay ---------- */
  function showOverlay(msg) {
    overlay.hidden = false;
    main.inert = true;
    authError.textContent = msg || '';
    passInput.focus();
  }
  function hideOverlay() {
    overlay.hidden = true;
    main.inert = false;
  }

  /* ---------- auth ---------- */
  function dropToken() { lsDel(TOKEN_KEY); token = null; }

  /* Enter/keep the page in local mode: log in (hide the overlay, un-inert the
     page), remember the mode across reloads, and run WITHOUT the backend. The
     token is dropped so no stale token can trigger a pull/push. The sync
     indicator shows the warning icon PERMANENTLY (showSyncIcon, not the
     flash variant) and never the spinner/success-tick. */
  function enterLocalMode() {
    lsSet(LOCAL_KEY, '1');
    dropToken();
    hideOverlay();
    localBanner.hidden = false;
    showSyncIcon('warn');
  }
  function isLocalMode() { return lsGet(LOCAL_KEY) === '1'; }

  var authSubmit = authForm.querySelector('.auth-submit');
  authForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var password = passInput.value;
    if (!password || authSubmit.disabled) return;
    authSubmit.disabled = true;   /* no concurrent auth attempts (rate limit) */
    authError.textContent = '';
    /* Local mode: the reserved passwords `local`/`test`/`debug` log in WITHOUT
       calling the API — no token, no server, everything stays in localStorage. */
    if (LOCAL_PASSWORDS.indexOf(password.trim().toLowerCase()) !== -1) {
      passInput.value = '';
      enterLocalMode();
      authSubmit.disabled = false;
      return;
    }
    fetch(API_BASE + '/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    }).then(function (r) {
      if (r.status === 200) {
        return r.json().then(function (data) {
          token = data.token;
          lsSet(TOKEN_KEY, token);
          passInput.value = '';   /* don't keep the plaintext in the DOM */
          hideOverlay();
          /* password typing doesn't count as page interaction — the user
             expects the post-auth reload that lands on their synced settings */
          interacted = false;
          syncFromServer();
        });
      }
      if (r.status === 429) { showOverlay('Demasiados intentos. Espera un momento.'); }
      else { showOverlay('Contraseña incorrecta.'); }
    }).catch(function () {
      showOverlay('No se pudo conectar con el servidor.');
    }).then(function () {
      authSubmit.disabled = false;
    });
  });

  /* ---------- pull ---------- */
  /* manual=true when invoked from the `p` command: same fetch+merge as the
     load-time pull, but NEVER reloads — the main IIFE applies the merged
     state live through window.__startOnPull (static state + data UI). */
  function syncFromServer(manual) {
    if (!token || isLocalMode()) return;
    /* this pull owns the indicator only while it stays the latest */
    var gen = ++syncGen;
    /* show the cycle-arrow while the pull is in flight */
    showSyncIcon('loading');
    fetch(API_BASE + '/api/data', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(function (r) {
      if (gen !== syncGen) return;   /* a newer pull superseded this one */
      if (r.status === 401) { dropToken(); showOverlay(); flashSyncResult('warn'); return; }
      if (!r.ok) { readyToPush = true; flashSyncResult('warn'); return; }
      return r.json().then(function (data) {
        if (gen !== syncGen) return;   /* a newer pull superseded this one */
        var items = (data && data.items) || {};
        var ts = readTs();
        var changed = false;
        SYNC_KEYS.forEach(function (k) {
          var it = items[k];
          if (!it || typeof it.ts !== 'number') return;
          if (it.ts <= (ts[k] || 0)) return;   /* local is newer — keep it */
          if (it.v === null || it.v === undefined) { lsDel(k); lastKnown[k] = null; }
          else { lsSet(k, String(it.v)); lastKnown[k] = String(it.v); }
          ts[k] = it.ts;
          changed = true;
        });
        writeTs(ts);
        readyToPush = true;
        if (changed) {
          /* a manual `p` pull applies the whole merged state live; an
             automatic pull only re-renders the data-driven UI while the
             user is interacting (static state stays in localStorage for
             the next load), and reloads when the user isn't typing */
          if (window.__startOnPull) { window.__startOnPull(manual); }
          if (!manual && !interacted) {
            /* show the success tick, then apply the synced state via reload —
               otherwise the reload preempts the tick for this pull */
            flashSyncResult('ok');
            setTimeout(function () { location.reload(); }, 1200);
            return;
          }
        }
        /* sync landed (and won't reload): flash the success tick */
        flashSyncResult('ok');
        /* flush local changes that never made it out (tab closed before the
           debounce fired): pull with no merge = server is older, push now */
        schedulePush();
      });
    }).catch(function () {
      if (gen !== syncGen) return;   /* a newer pull superseded this one */
      readyToPush = true;   /* offline: local-first, retry on next change/load */
      flashSyncResult('warn');
    });
  }

  /* ---------- push ---------- */
  function schedulePush() {
    if (pushTimer) { clearTimeout(pushTimer); }
    pushTimer = setTimeout(sendChanges, 700);
  }
  /* flush a pending push when the tab is closed / navigated away — the
     debounce would otherwise drop it (recovery only on the next load) */
  window.addEventListener('pagehide', function () {
    if (!pushTimer) return;
    clearTimeout(pushTimer);
    pushTimer = null;
    sendChanges(true);
  });
  function sendChanges(flush) {
    if (!token || !readyToPush || isLocalMode()) return;
    var ts = readTs();
    var items = {};
    SYNC_KEYS.forEach(function (k) {
      if (!ts[k]) return;   /* never touched locally: nothing to push */
      items[k] = { v: lsGet(k), ts: ts[k] };
    });
    if (Object.keys(items).length === 0) return;
    fetch(API_BASE + '/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
                 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ items: items }),
      keepalive: !!flush   /* let the request outlive the closing page */
    }).then(function (r) {
      if (r.status === 401) { dropToken(); showOverlay(); }
    }).catch(function () { /* offline: retried on next change/load */ });
  }

  /* ---------- hooks from the main IIFE ---------- */
  /* Manual pull (`p` in command mode): fetch + merge, apply live, never
     reload. Called by the main IIFE's command handler. */
  window.__startPullNow = function () { syncFromServer(true); };
  window.__startSync = {
    changed: function (key, val) {
      if (SYNC_KEYS.indexOf(key) === -1) return;
      if (val === lastKnown[key]) return;   /* restore re-applying a value */
      lastKnown[key] = val;
      var ts = readTs();
      ts[key] = Date.now();
      writeTs(ts);
      if (readyToPush) schedulePush();
    },
    removed: function (key) {
      if (SYNC_KEYS.indexOf(key) === -1) return;
      if (lastKnown[key] === null) return;
      lastKnown[key] = null;
      var ts = readTs();
      ts[key] = Date.now();
      writeTs(ts);
      if (readyToPush) schedulePush();
    }
  };
  /* The AI chat (main IIFE) fetches its own API routes with the same bearer
     token; expose the base URL + a live token getter (the token can be cleared
     by a 401 logout). `local` lets the chat fall back gracefully. */
  window.__startChatAccess = {
    base: API_BASE,
    token: function () { return token; },
    local: isLocalMode
  };
  /* The chat bar hides the sync indicator while it is open; restore its state
     when the user exits so local mode keeps its permanent warning and
     connected mode re-hides it (it is transient there). */
  window.__startSync.resurfaceIcon = function () {
    if (isLocalMode()) { showSyncIcon('warn'); }
    else { syncIcon.style.display = 'none'; }
  };

  /* ---------- init ---------- */
  /* don't auto-reload over the user mid-typing */
  window.addEventListener('keydown', function () { interacted = true; },
                          { once: true, capture: true });
  window.addEventListener('pointerdown', function () { interacted = true; },
                          { once: true, capture: true });

  token = lsGet(TOKEN_KEY);
  /* start.localMode persists the no-backend mode, so a reload stays local and
     never shows the overlay or talks to the API. */
  if (isLocalMode()) { enterLocalMode(); }
  else if (token) { syncFromServer(false); }
  else { showOverlay(); }
})();
</script>
