<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio — LQH-2011</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #666666;
    --faint: #999999;
    --line: #e0e0e0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    display: block;
    width: 100%;
    max-width: 560px;
    height: auto;
  }
  .search {
    width: 100%;
    max-width: 440px;
    margin: 44px 0 36px;
  }
  .search input {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    font: inherit;
    font-size: 18px;
    color: var(--ink);
    text-align: center;
    padding: 10px 0 8px;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    outline: none;
    transition: border-color .15s ease;
  }
  .search input:focus { border-bottom-color: var(--ink); }
  .search input::placeholder { color: var(--faint); }
  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 26px;
  }
  .links a {
    color: var(--muted);
    font-size: 15px;
    text-decoration: none;
    padding: 6px 0;
    transition: color .15s ease;
  }
  .links a:hover,
  .links a:focus-visible {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
