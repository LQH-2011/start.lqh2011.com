<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio — LQH-2011</title>
<link rel="icon" type="image/jpeg" href="https://blog.lqh2011.com/assets/img/favicon.jpg">
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #666666;
    --faint: #999999;
    --line: #e0e0e0;
    --logo: #111111;
    --logo-shadow: #b3b3b3;
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #111111;
    --ink: #e8e8e8;
    --muted: #9a9a9a;
    --faint: #6b6b6b;
    --line: #333333;
    --logo: #e8e8e8;
    --logo-shadow: #2a2a2a;
    color-scheme: dark;
  }
  /* Before the theme script resolves the pref, follow the OS so the first
     paint matches the system instead of flashing light. (The inline script
     runs synchronously before paint and always sets data-theme, so this only
     matters for the pre-JS / no-JS window.) */
  @media (prefers-color-scheme: dark) {
    html:not([data-theme]) {
      --bg: #111111;
      --ink: #e8e8e8;
      --muted: #9a9a9a;
      --faint: #6b6b6b;
      --line: #333333;
      --logo: #e8e8e8;
      --logo-shadow: #2a2a2a;
      color-scheme: dark;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background-color .2s ease, color .2s ease;
  }
  main {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    display: block;
    width: 100%;
    max-width: 560px;
    height: auto;
  }
  /* Finished-countdown flash: the block-art timer blinks for a few seconds
     when it elapses, then settles into the count-up display. */
  @keyframes timer-flash {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.12; }
  }
  .timer-flash { animation: timer-flash 1s infinite; }
  .search {
    position: relative;
    width: 100%;
    max-width: 440px;
    margin: 44px 0 36px;
  }
  .search-icon,
  .cmd-indicator,
  .globe-icon,
  .gear-icon,
  .timer-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .search-icon,
  .gear-icon,
  .timer-icon { display: flex; }
  .search-icon[hidden],
  .globe-icon[hidden],
  .gear-icon[hidden],
  .timer-icon[hidden] { display: none; }
  .cmd-indicator,
  .globe-icon {
    font-size: 15px;
    line-height: 1;
  }
  /* Sync status indicator: a small icon on the RIGHT of the bar that reflects
     the sync module's state — a spinning cycle-arrow while a pull is in
     flight, then a tick (success) or a warning (failure) that flashes and
     disappears. pointer-events:none so it never blocks typing; the mode icons
     on the LEFT are unaffected. Visibility is driven by inline style.display
     (NOT the `hidden` attribute) because Chromium does not reliably reflect
     `hidden` on <svg> elements into CSS. */
  .sync-icon {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    display: flex;
  }
  .sync-icon svg { display: none; }
  @keyframes sync-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .sync-icon .sync-loading { animation: sync-spin .8s linear infinite; }
  .search input {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    font: inherit;
    font-size: 18px;
    color: var(--ink);
    text-align: left;
    padding: 10px 0 8px 34px;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    outline: none;
    transition: border-color .15s ease;
  }
  .search input:focus { border-bottom-color: var(--ink); }
  .search input::placeholder { color: var(--faint); }
  /* URL-history dropdown: same width as the bar, shown only while the bar
     has text in url mode. Themed via the same CSS variables as the page. */
  .url-history {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
    z-index: 5;
    max-height: 300px;
    overflow-y: auto;
  }
  .url-history[hidden] { display: none; }
  .url-history-item {
    padding: 8px 12px;
    font-size: 14px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .url-history-item.active { background: var(--line); }
  /* Timer list rows (timers manager): name + kind badge + live time. Reuses
     the .url-history dropdown chrome; the row is a 3-part flex so the name
     truncates and the kind/time align right. */
  .timer-row { display: flex; align-items: baseline; gap: 10px; }
  .timer-row .timer-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .timer-row .timer-kind {
    color: var(--faint);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
    flex: none;
  }
  .timer-row .timer-time { font-variant-numeric: tabular-nums; flex: none; }
  /* "Abrir este URL…" row: an action (opens the typed text), not a history
     entry — muted + separated so it reads as such. */
  .url-history-action {
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 26px;
  }
  .links a {
    color: var(--muted);
    font-size: 15px;
    text-decoration: none;
    padding: 6px 0;
    transition: color .15s ease;
  }
  .links a:hover,
  .links a:focus-visible {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  /* ---------- auth overlay (sync) ---------- */
  .auth-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 10;
  }
  .auth-overlay[hidden] { display: none; }
  .auth-card {
    width: 100%;
    max-width: 280px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .auth-label { font-size: 14px; color: var(--muted); }
  .auth-card input {
    font: inherit;
    font-size: 18px;
    color: var(--ink);
    padding: 10px 0 8px;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    outline: none;
  }
  .auth-card input:focus { border-bottom-color: var(--ink); }
  .auth-card input::placeholder { color: var(--faint); }
  .auth-error { font-size: 13px; color: #b00020; min-height: 16px; }
  .auth-submit {
    font: inherit;
    font-size: 15px;
    color: var(--bg);
    background: var(--ink);
    border: 0;
    border-radius: 4px;
    padding: 9px 0;
    cursor: pointer;
  }
  .auth-submit:hover { opacity: .9; }
  .auth-note { font-size: 12px; color: var(--faint); text-align: center; }
</style>
</head>

  }
  /** Move the dropdown highlight by delta (wrapping) and sync the displayed
      timer to the newly highlighted row — matching 1-9 digit selection, so the
      slot always shows the timer the arrows have selected. */
  function moveTimerIndex(delta) {
    if (timers.length === 0) return;
    timerIndex = (timerIndex + delta + timers.length) % timers.length;
    renderTimerList();
    showTimer(timers[timerIndex]);
  }
  /** Bind the timer at idx to the display slot (show it). */
  function selectTimerAt(idx) {
    if (idx < 0 || idx >= timers.length) return;
    showTimer(timers[idx]);
    updateTimerMenu();
  }
  /** Start the timer at idx (bind to the slot + run it). */
  function startTimerAt(idx) {
    if (idx < 0 || idx >= timers.length) return;
    startTimer(timers[idx]);
    renderTimerList();
  }
  /** Start the add-timer prompt (name -> kind -> duration). */
  function startTimerAdd() {
    input.value = '';
    input.placeholder = 'Nombre del temporizador…';
    promptState = { kind: 'tadd', step: 'name' };
    input.focus();
  }
  /** Start the rename/duration edit prompt for the timer at idx. */
  function startTimerEdit(idx) {
    if (idx < 0 || idx >= timers.length) return;
    var t = timers[idx];
    promptState = { kind: 'tedit', idx: idx, step: 'name' };
    input.value = t.name;
    input.placeholder = 'Nombre (Enter = dejar igual)…';
  }
  /** Start the delete-confirm prompt for the timer at idx. */
  function startTimerDelete(idx) {
    if (idx < 0 || idx >= timers.length) return;
    promptState = { kind: 'tdelete', idx: idx };
    input.value = '';
    input.placeholder = '¿Borrar? (s/n)';
  }
  /** Handle a typed character in the timers manager. During a multi-step
      prompt the keys are field content, not menu keys. */
  function handleTimersKey(c) {
    /* during a multi-step prompt the keys are field content, not menu keys */
    if (promptState) return;
    if (c === 'a')      { startTimerAdd(); }
    else if (c === 'e') { startTimerEdit(timerIndex); }
    else if (c === 'x') { startTimerDelete(timerIndex); }
    else if (c === 'y') { startTimerAt(timerIndex); input.value = ''; }
    else if (c === 'z') { togglePause(timers[timerIndex]); input.value = ''; }
    else if (/^[1-9]$/.test(c)) {
      /* 1-9 select & show the Nth timer (1 = first), like the URL/bookmark
         list; also move the highlight to match the keyboard reference.
         (Independent of the bookmark-count-bound isDigitKey.) */
      var dn = Number(c) - 1;
      if (dn >= 0 && dn < timers.length) { timerIndex = dn; selectTimerAt(dn); }
      input.value = '';
    }
    else if (c === 'c') { toggleClock(); input.value = ''; }
    else if (c === 'k') { toggleTheme(); input.value = ''; }
    else if (c === 'r') { resetTimer(timers[timerIndex]); input.value = ''; }
    else { editArmed = false; deleteArmed = false; enterSettings(); handleSettingsKey(c); }
  }

  /* ---------- restore saved state ---------- */
  /* start.activeMode is a one-shot flag written by the `r` refresh command in
     command/settings mode, so the reload lands back in that submode instead of
     the persisted top mode. It is cleared on load. NOTE: restoring a submode
     must NOT return early here — that would skip registering the input/submit/
     shortcut listeners below and leave the page dead. */
  var restoredSubmode = null;
  try {
    applyTheme(getThemePref());   /* 'sys' follows the OS; explicit light/dark wins */
    var savedEngine = localStorage.getItem('start.engine');
    if (savedEngine && ENGINES[savedEngine]) { setEngine(savedEngine); }
    var savedClock = localStorage.getItem('start.clock');
    if (savedClock === 'on') {
      clockOn = true;
      showClock();
      clockTimer = setInterval(showClock, 1000);
    }
    var savedMode = localStorage.getItem('start.mode');
    if (savedMode === 'url' || savedMode === 'search') { topMode = savedMode; }
    var savedActiveMode = sessionStorage.getItem('start.activeMode');
    if (savedActiveMode === 'command' || savedActiveMode === 'settings' ||
        savedActiveMode === 'links' || savedActiveMode === 'timers') {
      restoredSubmode = savedActiveMode;
    }
  } catch (e) {}
  try { sessionStorage.removeItem('start.activeMode'); } catch (e) {}
  /* Follow OS theme changes live — but ONLY while the pref is 'sys'. An
     explicit light/dark choice ignores later OS switches; `k` pins a new
     explicit choice. Re-read the pref on every change so a toggle between
     events is respected. */
  if (window.matchMedia) {
    var systemThemeMq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSystemThemeChange = function () {
      if (getThemePref() === 'sys') { applyTheme('sys'); }
    };
    if (systemThemeMq.addEventListener) { systemThemeMq.addEventListener('change', onSystemThemeChange); }
    else if (systemThemeMq.addListener) { systemThemeMq.addListener(onSystemThemeChange); }
  }
  loadBookmarks();
  loadHistory();
  renderLinks();
  /* A saved timer takes the display slot (after clock restore). loadTimers
     also migrates the old single-timer record (start.timer) if present. Run
     it BEFORE setMode so a reload into the timers submenu shows the restored
     list in the dropdown. */
  var restoredTimer = loadTimers();
  if (restoredTimer && timerVisible) { showTimer(restoredTimer); }
  else { ensureTimerTick(); }
  setMode(restoredSubmode || topMode);
  /* The sync module (second <script> block) calls this after a pull applied
     server changes. full=true (manual `p` pull): re-apply the WHOLE
     load-time restore live, without a reload — static state (theme, engine,
     top mode, clock, timer) as well as the data-driven UI (bookmark nav,
     history dropdown). full=false (automatic pull while the user is already
     typing): only the data-driven UI re-renders live; the merged static
     state is left in localStorage for the next load, so a background pull
     never yanks the UI mid-input. The current submode is never changed —
     only the persisted topMode is refreshed. */
  window.__startOnPull = function (full) {
    if (full) {
      /* theme — device-specific, never synced; re-apply the LOCAL pref to
         mirror the load-time restore (a pull can't change it) */
      applyTheme(getThemePref());
      /* engine (refresh the search placeholder if that view is active) */
      var eng = null;
      try { eng = localStorage.getItem('start.engine'); } catch (e) {}
      if (eng && ENGINES[eng]) {
        engine = eng;
        form.action = ENGINES[eng].action;
        input.name = ENGINES[eng].q;
        if (mode === 'search') { input.placeholder = ENGINES[eng].ph; }
      }
      /* persisted top mode (url/search) — never pull the user out of a submode */
      var m = null;
      try { m = localStorage.getItem('start.mode'); } catch (e) {}
      if (m === 'url' || m === 'search') { topMode = m; }
      /* clock */
      var clk = null;
      try { clk = localStorage.getItem('start.clock'); } catch (e) {}
      clockOn = (clk === 'on');
      /* timer: server deleted it -> stop the local one (back to clock/logo);
         server has a newer record -> replace the running machinery and
         restore the new one from storage */
      var tls = null;
      try { tls = localStorage.getItem('start.timers'); } catch (e) {}
      if (tls === null) {
        /* server deleted the timer list -> stop local timers, back to base.
           Do NOT call saveTimers() here: that would write start.timers:'[]'
           as a real value and overwrite the remote deletion (it would re-publish
           an empty list instead of keeping it deleted). Drop the keys locally and
           signal a removal so the sync module doesn't push a value. */
        if (timers.length) {
          if (timerTick) { clearInterval(timerTick); timerTick = null; }
          timers = [];
          activeId = null;
          timerVisible = false;
          clearTimerFlash();
          ['start.timers', 'start.timerActive', 'start.timerVisible'].forEach(function (k) {
            try { localStorage.removeItem(k); } catch (e) {}
            if (window.__startSync) { window.__startSync.removed(k); }
          });
          updateTimerMenu();
        }
      } else {
        /* server has a newer list -> replace the running machinery and
           restore the new list from storage */
        if (timerTick) { clearInterval(timerTick); timerTick = null; }
        var act = loadTimers();
        if (act && timerVisible) { showTimer(act); }
        else { ensureTimerTick(); }
      }
      /* reconcile the display slot: a visible timer owns it; otherwise the
         clock (if on) or the logo — same final state as a load-time restore */
      if (!getActive() || !timerVisible) {
        if (clockOn) {
          showClock();
          if (!clockTimer) { clockTimer = setInterval(showClock, 1000); }
        } else {
          showLogo();
          stopClockTimer();
        }
      }
      updateTimerMenu();
    }
    /* data-driven UI */
    loadBookmarks();
    renderLinks();
    loadHistory();
    updateHistoryMenu();
  };

  /* `p` in command mode: pull the latest synced settings from the DB and
     apply them live (no page reload). The sync module exposes the actual
     fetch+merge; this just guards for its absence (old browsers). */
  function pullFromServer() {
    if (window.__startPullNow) { window.__startPullNow(); }
  }

  /* ---------- sub-mode key handling ---------- */
  /* Any mode: typing "aaa" (or "/" or "-") enters command mode.
     Command mode: a=Abrir (url top), b=Buscar (search top), c=clock,
     f=fullscreen, k=theme,
     p=pull from DB (no reload), s (or "/" or "-" again) = settings, t=timer
     (show active, or quick countdown entry), u=quick count-up, y=start the
     active timer, h=hours, x=delete the active timer (confirm s/y),
     z=pause/resume the active timer, r=reset it.
     Settings mode: b/g/d/w/f/e engines, c/k toggles, l=links, t=timers,
     x=logout (confirm s/y), r=reset the active timer.
     Links mode: 1-9 open, a=add, e=edit, x=delete, c/k toggles, r=reload.
     Timers mode: ↑/↓ select & show, a=add, e=rename, x=delete, y=start,
     z=pause/resume, r=reset, c/k toggles.
     Any other character exits to the selected top mode keeping the text;
     in links/timers mode an unknown key pops one level UP to settings, where
     the same keystroke is then evaluated (e.g. `g` in links picks Google). */
  /** Start the delete-confirm flow for the active timer (command mode / global). */
  function deleteActiveTimer() {
    var idx = indexOfActive();
    if (idx >= 0) { startTimerDelete(idx); }
  }
  function handleCommandKey(c) {
    /* during a multi-step prompt (e.g. the timer delete confirm) the typed
       keys are field content, not menu keys */
    if (promptState) return;
    if (c === 'a')      { selectTop('url'); }
    else if (c === 'b') { selectTop('search'); }
    else if (c === 'c') { toggleClock(); input.value = ''; }
    else if (c === 'f') { toggleFullscreen(); input.value = ''; }
    else if (c === 'k') { toggleTheme(); input.value = ''; }
    else if (c === 'p') { pullFromServer(); input.value = ''; }
    else if (c === 's' || c === '/' || c === '-') { enterSettings(); }
    else if (c === 't') { enterTimers(); }
    else if (c === 'u') { startCountup(); input.value = ''; }
    else if (c === 'y') { startActive(); input.value = ''; }
    else if (c === 'h') { toggleHours(); input.value = ''; }
    else if (c === 'x') { deleteActiveTimer(); }
    else if (c === 'z') { togglePause(getActive()); input.value = ''; }
    else if (c === 'r') { resetTimer(getActive()); input.value = ''; }
    else { exitToTop(); }
  }
  /* settings mode: picking an engine selects search as the top mode, so
     backspace/Enter from command mode return to the search bar */
  function handleSettingsKey(c) {
    if (promptState) return;   /* logout confirm: typed keys are the answer */
    if (c === 'b')      { setEngine('bing');     selectTop('search'); }
    else if (c === 'g') { setEngine('google');    selectTop('search'); }
    else if (c === 'd') { setEngine('deepseek');  selectTop('search'); }
    else if (c === 'w') { setEngine('wikipedia'); selectTop('search'); }
    else if (c === 'f') { setEngine('jackyforum'); selectTop('search'); }
    else if (c === 'e') { setEngine('rae');         selectTop('search'); }
    else if (c === 'c') { toggleClock(); input.value = ''; }
    else if (c === 'k') { toggleTheme(); input.value = ''; }
    else if (c === 'l') { enterLinks(); }
    else if (c === 't') { enterTimers(); }
    else if (c === 'x') { startLogout(); }
    else if (c === 'r') { resetTimer(getActive()); input.value = ''; }
    else { exitToTop(); }
  }
  function handleLinksKey(c) {
    /* during a multi-step prompt the keys are field content, not menu keys */
    if (promptState) return;
    if (c === 'a')      { startAdd(); }
    else if (c === 'e') { editArmed = true; input.value = ''; }
    else if (c === 'x') { deleteArmed = true; input.value = ''; }
    else if (isDigitKey(c)) {
      var n = Number(c);
      if (editArmed)        { editArmed = false; startEdit(n); }
      else if (deleteArmed) { deleteArmed = false; startDelete(n); }
      else { openPinned(n); input.value = ''; }
    }
    else if (c === 'c') { toggleClock(); input.value = ''; }
    else if (c === 'k') { toggleTheme(); input.value = ''; }
    else if (c === 'r') { saveSession('start.activeMode', 'links'); location.reload(); }
    else { editArmed = false; deleteArmed = false; enterSettings(); handleSettingsKey(c); }
  }

  input.addEventListener('input', function () {
    var v = input.value;
    var c = v.toLowerCase();   /* commands are case-insensitive */
    if (mode === 'url' || mode === 'search') {
      if (c === 'aaa' || c === '/' || c === '-') { enterCmd(); }
      else if (mode === 'url') { updateHistoryMenu(); }
      return;
    }
    if (mode === 'command') { handleCommandKey(c); return; }
    if (mode === 'timer') {
      /* countdown value: digits and colons only; anything else is a typo —
         leave timer mode keeping the text in the selected top mode */
      if (!/^[0-9:]*$/.test(v)) exitToTop();
      return;
    }
    if (mode === 'settings') { handleSettingsKey(c); return; }
    if (mode === 'links') { handleLinksKey(c); return; }
    if (mode === 'timers') { handleTimersKey(c); return; }
  });

  /* Backspace on an empty prompt goes one layer up: links -> settings ->
     command -> top; Escape climbs the same stack at any time and cancels a
     bookmark prompt mid-typing. Keys 1-9 open the pinned links ONLY while
     the bar is focused in COMMAND mode (no modifiers, no repeat). In
     url/search/settings the digits type into the bar normally. */
  input.addEventListener('keydown', function (e) {
    /* url mode with the history dropdown open: arrows move the highlight,
       Enter opens the highlighted row (row 0 = "Abrir este URL…" opens the
       typed text), `d` deletes a highlighted history entry, Escape closes
       the menu. */
    if (mode === 'url' && !historyMenu.hidden) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveHistoryIndex(1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); moveHistoryIndex(-1); return; }
      if (e.key === 'Enter') {
        /* Row 0 is the "Abrir este URL…" action; any other highlighted row
           is a history entry. */
        if (historyIndex === 0) { e.preventDefault(); openUrl(); }
        else if (matches[historyIndex - 1]) { e.preventDefault(); selectHistory(matches[historyIndex - 1]); }
        return;
      }
      if ((e.key === 'd' || e.key === 'D') && !e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat) {
        /* delete the highlighted history entry; on the action row the key
           types into the bar normally (filtering the list). Modifier
           combos (Ctrl+D bookmark, Alt+D address bar) and held-key
           repeats are never hijacked. */
        if (historyIndex > 0 && matches[historyIndex - 1]) {
          e.preventDefault();
          deleteHistory(matches[historyIndex - 1]);
        }
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); hideHistoryMenu(); return; }
    }
    /* timers manager dropdown: arrows move the highlight and show the selected timer (only when not mid-prompt) */
    if (mode === 'timers' && !promptState && !timerMenu.hidden) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveTimerIndex(1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); moveTimerIndex(-1); return; }
    }
    if (e.key === 'Escape' && (mode === 'command' || mode === 'settings' ||
                               mode === 'links' || mode === 'timers' ||
                               mode === 'timer')) {
      e.preventDefault();
      if (promptState) { cancelPrompt(); }
      else if (mode === 'links') { enterSettings(); }
      else if (mode === 'timers') { enterSettings(); }
      else if (mode === 'settings') { enterCmd(); }
      else if (mode === 'command') { exitToTop(); }
      else if (mode === 'timer') { enterCmd(); }
      return;
    }
    if (mode === 'command' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat && isDigitKey(e.key)) {
      e.preventDefault();
      openPinned(Number(e.key));
      return;
    }
    if (e.key !== 'Backspace' || input.value !== '') return;
    if (mode === 'links') {
      e.preventDefault();
      if (promptState) { cancelPrompt(); }
      else { enterSettings(); }
    }
    else if (mode === 'timers') {
      e.preventDefault();
      if (promptState) { cancelPrompt(); }
      else { enterSettings(); }
    }
    else if (mode === 'settings') {
      e.preventDefault();
      if (promptState) { cancelPrompt(); }
      else { enterCmd(); }
    }
    else if (mode === 'command') { e.preventDefault(); exitToTop(); }
    else if (mode === 'timer') { e.preventDefault(); enterCmd(); }
  });

  /* Clicking anywhere else (or tabbing out) closes the dropdown. Item
     selection uses mousedown + preventDefault, so it keeps the input focus
     and blur never races the pick. */
  input.addEventListener('blur', function () { hideHistoryMenu(); updateTimerMenu(); });
  input.addEventListener('focus', function () { updateTimerMenu(); });

  /* ---------- global shortcuts (bar NOT focused) ---------- */
  /* After clicking a bookmark link or anywhere else, the bar loses focus and
     keys do nothing. These page-level shortcuts only fire when NO editable
     element is focused (typed keys still go to the bar or any other editable
     element normally). Modifier combos (ctrl/meta/alt) are never hijacked. */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    /* Never hijack keys while ANY editable element has focus — not just the
       search bar (a textarea or contenteditable could be added later). */
    var ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
    var k = e.key.toLowerCase();
    if (k === 'a') {
      /* activate the url/search bar, keeping the current top mode */
      e.preventDefault();
      input.focus();
    } else if (k === '/' || k === '-') {
      e.preventDefault();
      enterCmd();
      input.focus();
    } else if (k === 's') {
      e.preventDefault();
      enterSettings();
      input.focus();
    } else if (k === 't') {
      /* the active timer comes back on display (no focus steal, like c/k);
         with no active timer, enter timer setup like `s` enters settings */
      e.preventDefault();
      var act = getActive();
      if (act) { showTimer(act); }
      else { enterTimer(); input.focus(); }
    } else if (k === 'c') {
      e.preventDefault();
      toggleClock();
    } else if (k === 'k') {
      e.preventDefault();
      toggleTheme();
    } else if (k === 'z') {
      /* pause/resume the active timer (bring it forward like `t` for feedback) */
      var tz = getActive();
      if (tz) { e.preventDefault(); showTimer(tz); togglePause(tz); }
    } else if (k === 'r') {
      /* reset the active timer (bring it forward like `t` for feedback) */
      var tr = getActive();
      if (tr) { e.preventDefault(); showTimer(tr); resetTimer(tr); }
    } else if (k === 'x') {
      /* delete the active timer (confirm s/y); enter command mode for the prompt */
      if (getActive()) { e.preventDefault(); enterCmd(); deleteActiveTimer(); input.focus(); }
    } else if (isDigitKey(k)) {
      /* 1-9 open the pinned links */
      e.preventDefault();
      openPinned(Number(k));
    }
  });

  form.addEventListener('submit', function (e) {
    if (mode === 'url') { e.preventDefault(); openUrl(); return; }
    if (mode === 'timer') { e.preventDefault(); commitTimer(); return; }
    if (mode === 'links') {
      e.preventDefault();
      if (promptState) { commitPrompt(); }
      else { exitToTop(); input.value = ''; }
      return;
    }
    if (mode === 'timers') {
      e.preventDefault();
      if (promptState) { commitPrompt(); }
      else if (timers.length) { selectTimerAt(timerIndex); }
      else { exitToTop(); input.value = ''; }
      return;
    }
    if (mode === 'command' || mode === 'settings') {
      /* Enter during a prompt commits it; otherwise (empty bar or any
         Enter in a sub-mode) returns to the top */
      e.preventDefault();
      if (promptState) { commitPrompt(); }
      else { exitToTop(); input.value = ''; }
      return;
    }
    /* search mode: results open in a new tab, so clear the input for the next query;
       defer so the submitted query is not affected */
    var eng = ENGINES[engine];
    if (eng && eng.url) {
      /* path-based engine (RAE Diccionario del Estudiante): the query lives
         in the URL path (…/diccionario-estudiante/{q}), which a native GET
         form can't express — build the URL and open it directly */
      e.preventDefault();
      window.open(eng.url.replace('{q}', encodeURIComponent(input.value.trim())),
                  '_blank', 'noopener');
    }
    setTimeout(function () { input.value = ''; }, 0);
  });
})();
</script>
<script>
/* ---------- sync (auth + cross-device settings) ----------
   The page is local-first: it renders from localStorage exactly as before.
   This module only adds a one-time password gate per device, a pull of the
   settings from the DB after auth (last-write-wins by timestamp), and a
   debounced push of every save()/timer-stop. If the API is unreachable the
   page keeps working with local state; the next change or reload retries. */
(function () {
  'use strict';

  var API_BASE = 'https://start-api.lqh2011.com';
  /* same-origin fallback: Vercel also serves the static page, so opening the
     API host directly talks to the API with no CORS involved; likewise when
     served locally by scripts/dev-server.js (npm run dev) */
  if (['start-api.lqh2011.com', 'localhost', '127.0.0.1'].indexOf(location.hostname) !== -1) {
    API_BASE = '';
  }

  /* Device-specific keys (theme) are intentionally NOT listed: start.theme
     stays in localStorage only, so each device keeps its own light/dark/
     system choice. */
  var SYNC_KEYS = ['start.mode', 'start.engine', 'start.clock',
                   'start.timers', 'start.timerActive', 'start.timerVisible',
                   'start.timerHours', 'start.bookmarks', 'start.history'];
  var TOKEN_KEY = 'start.token';
  var TS_KEY = 'start.sync.ts';   /* key -> ms of the value in localStorage */

  var overlay = document.getElementById('authOverlay');
  var authForm = document.getElementById('authForm');
  var passInput = document.getElementById('authPassword');
  var authError = document.getElementById('authError');
  var main = document.querySelector('main');

  var token = null;
  var readyToPush = false;
  var pushTimer = null;
  var interacted = false;
  /* lastKnown[key] = the value we believe is current (local or pulled).
     save() with an identical value is a no-op restore, not a user change —
     it must not bump the timestamp or trigger a push. */
  var lastKnown = {};
  SYNC_KEYS.forEach(function (k) { lastKnown[k] = lsGet(k); });

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function readTs() { try { return JSON.parse(lsGet(TS_KEY) || '{}'); } catch (e) { return {}; } }
  function writeTs(map) { lsSet(TS_KEY, JSON.stringify(map)); }

  /* ---------- sync status indicator (typing bar) ---------- */
  /* A small icon on the right of the search bar reflects the sync state: a
     spinning cycle-arrow while a pull is in flight, then a tick (success) or
     a warning (failure) that flashes for a moment and disappears. It shows on
     the first load (and on the manual `p` pull / post-auth sync), and never
     blocks typing (pointer-events:none). */
  var syncIcon = document.getElementById('syncIcon');
  var syncLoading = syncIcon.querySelector('.sync-loading');
  var syncOk = syncIcon.querySelector('.sync-ok');
  var syncWarn = syncIcon.querySelector('.sync-warn');
  var syncFlashTimer = null;
  /* Show exactly one child icon (or none) and show/hide the container. The
     icon container starts `hidden` (display:none via the UA [hidden] rule);
     once a sync runs we drive display via inline style so the per-state icon
     reliably paints (the `hidden` attribute is unreliable on <svg>). */
  function showSyncIcon(state) {
    if (syncFlashTimer) { clearTimeout(syncFlashTimer); syncFlashTimer = null; }
    syncLoading.style.display = (state === 'loading') ? 'block' : 'none';
    syncOk.style.display = (state === 'ok') ? 'block' : 'none';
    syncWarn.style.display = (state === 'warn') ? 'block' : 'none';
    syncIcon.style.display = state ? 'flex' : 'none';
  }
  /* Briefly flash an ok/warn result, then hide the icon. */
  function flashSyncResult(state) {
    showSyncIcon(state);
    if (syncFlashTimer) { clearTimeout(syncFlashTimer); }
    syncFlashTimer = setTimeout(function () { syncIcon.style.display = 'none'; }, 1200);
  }

  /* ---------- overlay ---------- */
  function showOverlay(msg) {
    overlay.hidden = false;
    main.inert = true;
    authError.textContent = msg || '';
    passInput.focus();
  }
  function hideOverlay() {
    overlay.hidden = true;
    main.inert = false;
  }

  /* ---------- auth ---------- */
  function dropToken() { lsDel(TOKEN_KEY); token = null; }

  var authSubmit = authForm.querySelector('.auth-submit');
  authForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var password = passInput.value;
    if (!password || authSubmit.disabled) return;
    authSubmit.disabled = true;   /* no concurrent auth attempts (rate limit) */
    authError.textContent = '';
    fetch(API_BASE + '/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    }).then(function (r) {
      if (r.status === 200) {
        return r.json().then(function (data) {
          token = data.token;
          lsSet(TOKEN_KEY, token);
          passInput.value = '';   /* don't keep the plaintext in the DOM */
          hideOverlay();
          /* password typing doesn't count as page interaction — the user
             expects the post-auth reload that lands on their synced settings */
          interacted = false;
          syncFromServer();
        });
      }
      if (r.status === 429) { showOverlay('Demasiados intentos. Espera un momento.'); }
      else { showOverlay('Contraseña incorrecta.'); }
    }).catch(function () {
      showOverlay('No se pudo conectar con el servidor.');
    }).then(function () {
      authSubmit.disabled = false;
    });
  });

  /* ---------- pull ---------- */
  /* manual=true when invoked from the `p` command: same fetch+merge as the
     load-time pull, but NEVER reloads — the main IIFE applies the merged
     state live through window.__startOnPull (static state + data UI). */
  function syncFromServer(manual) {
    if (!token) return;
    /* show the cycle-arrow while the pull is in flight */
    showSyncIcon('loading');
    fetch(API_BASE + '/api/data', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(function (r) {
      if (r.status === 401) { dropToken(); showOverlay(); flashSyncResult('warn'); return; }
      if (!r.ok) { readyToPush = true; flashSyncResult('warn'); return; }
      return r.json().then(function (data) {
        var items = (data && data.items) || {};
        var ts = readTs();
        var changed = false;
        SYNC_KEYS.forEach(function (k) {
          var it = items[k];
          if (!it || typeof it.ts !== 'number') return;
          if (it.ts <= (ts[k] || 0)) return;   /* local is newer — keep it */
          if (it.v === null || it.v === undefined) { lsDel(k); lastKnown[k] = null; }
          else { lsSet(k, String(it.v)); lastKnown[k] = String(it.v); }
          ts[k] = it.ts;
          changed = true;
        });
        writeTs(ts);
        readyToPush = true;
        if (changed) {
          /* a manual `p` pull applies the whole merged state live; an
             automatic pull only re-renders the data-driven UI while the
             user is interacting (static state stays in localStorage for
             the next load), and reloads when the user isn't typing */
          if (window.__startOnPull) { window.__startOnPull(manual); }
          if (!manual && !interacted) { location.reload(); return; }
        }
        /* sync landed (and won't reload): flash the success tick */
        flashSyncResult('ok');
        /* flush local changes that never made it out (tab closed before the
           debounce fired): pull with no merge = server is older, push now */
        schedulePush();
      });
    }).catch(function () {
      readyToPush = true;   /* offline: local-first, retry on next change/load */
      flashSyncResult('warn');
    });
  }

  /* ---------- push ---------- */
  function schedulePush() {
    if (pushTimer) { clearTimeout(pushTimer); }
    pushTimer = setTimeout(sendChanges, 700);
  }
  /* flush a pending push when the tab is closed / navigated away — the
     debounce would otherwise drop it (recovery only on the next load) */
  window.addEventListener('pagehide', function () {
    if (!pushTimer) return;
    clearTimeout(pushTimer);
    pushTimer = null;
    sendChanges(true);
  });
  function sendChanges(flush) {
    if (!token || !readyToPush) return;
    var ts = readTs();
    var items = {};
    SYNC_KEYS.forEach(function (k) {
      if (!ts[k]) return;   /* never touched locally: nothing to push */
      items[k] = { v: lsGet(k), ts: ts[k] };
    });
    if (Object.keys(items).length === 0) return;
    fetch(API_BASE + '/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
                 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ items: items }),
      keepalive: !!flush   /* let the request outlive the closing page */
    }).then(function (r) {
      if (r.status === 401) { dropToken(); showOverlay(); }
    }).catch(function () { /* offline: retried on next change/load */ });
  }

  /* ---------- hooks from the main IIFE ---------- */
  /* Manual pull (`p` in command mode): fetch + merge, apply live, never
     reload. Called by the main IIFE's command handler. */
  window.__startPullNow = function () { syncFromServer(true); };
  window.__startSync = {
    changed: function (key, val) {
      if (SYNC_KEYS.indexOf(key) === -1) return;
      if (val === lastKnown[key]) return;   /* restore re-applying a value */
      lastKnown[key] = val;
      var ts = readTs();
      ts[key] = Date.now();
      writeTs(ts);
      if (readyToPush) schedulePush();
    },
    removed: function (key) {
      if (SYNC_KEYS.indexOf(key) === -1) return;
      if (lastKnown[key] === null) return;
      lastKnown[key] = null;
      var ts = readTs();
      ts[key] = Date.now();
      writeTs(ts);
      if (readyToPush) schedulePush();
    }
  };

  /* ---------- init ---------- */
  /* don't auto-reload over the user mid-typing */
  window.addEventListener('keydown', function () { interacted = true; },
                          { once: true, capture: true });
  window.addEventListener('pointerdown', function () { interacted = true; },
                          { once: true, capture: true });

  token = lsGet(TOKEN_KEY);
  if (token) { syncFromServer(false); }
  else { showOverlay(); }
})();
</script>
</body>
</html>
