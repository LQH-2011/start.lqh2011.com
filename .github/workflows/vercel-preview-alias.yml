# Assigns preview.lqh2011.com to the latest successful Vercel preview build.
#
# Why: Vercel's automatic PR previews live on *.vercel.app, which is not
# reachable from China. This workflow re-aliases them to a custom domain
# that is.
#
# Design (one run per PR event, never per deployment status):
#   - Triggered by pull_request events (opened/synchronize/reopened), so
#     production deploys and GH Pages deploys on main never create runs —
#     the old `deployment_status` trigger produced a skipped run for every
#     status event in the repo (queued/building/ready x Vercel + GH Pages),
#     which flooded the Actions list with ~5 no-op runs per push to main.
#   - Polls the GitHub deployments API until the Vercel *preview* build for
#     this PR's head commit is ready, then aliases. The `opened` event finds
#     an already-built preview immediately, which replaces the old
#     backfill-comment job.
#   - Runs queue in a single concurrency group (no cancel-in-progress), so
#     no run is ever cancelled: the newest PR event always aliases last and
#     preview.lqh2011.com stays on the most recent ready preview.
#   - Build failures and wait timeouts exit cleanly (exit 0, no red X on the
#     PR); the next push retries.
#
# Deployment protection is intentional: preview.lqh2011.com is NOT public
# (Vercel account setting) — do not add bypass logic here.

name: Alias Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # Read deployments to poll for the Vercel preview build; PR comments are
  # posted via the issues comments API. NOTE: the GITHUB_TOKEN needs
  # pull-requests: write here even though the REST docs say issues: write
  # alone suffices — empirically (verified 2026-08-16) creating a NEW comment
  # on a PULL REQUEST 403s with "Resource not accessible by integration" when
  # pull-requests is read-only, while updating an existing comment still works.
  # A previous CodeRabbit "hardening" to pull-requests: read silently broke
  # comment creation for any PR that had no prior status comment.
  deployments: read
  pull-requests: write
  issues: write
  contents: read   # for actions/checkout (comment script lives in the repo)

jobs:
  alias-preview:
    # Queue (never cancel): a newer PR event waits for the older run, then
    # aliases last — so preview.lqh2011.com always ends on the newest ready
    # preview and no run is omitted from the Actions list.
    concurrency:
      group: vercel-preview-alias
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Poll until the Vercel preview build for THIS head commit is ready.
      # Vercel's build takes ~30-60s after a push; the PR event fires before
      # the deployment exists, so this loop waits for it.
      - name: Wait for the Vercel preview build
        id: wait-preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          MAX_ATTEMPTS=25   # 25 x ~12s ≈ 5 min of waiting for the build
          PREVIEW_URL=""
          attempt=0
          while [ "$attempt" -lt "$MAX_ATTEMPTS" ]; do
            attempt=$((attempt + 1))
            saw_pending=0
            saw_error=0
            # Newest-first list of Vercel preview deployments for this SHA.
            DEPLOYMENTS="$(gh api "repos/${REPO}/deployments?sha=${HEAD_SHA}&per_page=100" \
              --jq '[.[] | select((.environment | ascii_downcase) == "preview" and .creator.login == "vercel[bot]")]')"
            if [ "$(printf '%s' "$DEPLOYMENTS" | jq 'length')" -gt 0 ]; then
              for row in $(printf '%s' "$DEPLOYMENTS" | jq -r '.[] | @base64'); do
                dep="$(printf '%s' "$row" | base64 -d)"
                id="$(printf '%s' "$dep" | jq -r '.id')"
                state="$(gh api "$(printf '%s' "$dep" | jq -r '.statuses_url')" --jq '.[0].state')"
                if [ "$state" = "ready" ] || [ "$state" = "success" ]; then
                  PREVIEW_URL="$(gh api "$(printf '%s' "$dep" | jq -r '.statuses_url')" --jq '.[0].target_url')"
                  echo "Vercel preview ready (deployment ${id}): ${PREVIEW_URL}"
                  break 2
                elif [ "$state" = "error" ] || [ "$state" = "failure" ]; then
                  echo "Deployment ${id} failed (state=${state}); checking older deployments for the same SHA"
                  saw_error=1
                else
                  echo "Deployment ${id} still ${state}"
                  saw_pending=1
                fi
              done
            else
              echo "No Vercel preview deployment yet for ${HEAD_SHA}"
            fi
            if [ "$saw_error" = 1 ] && [ "$saw_pending" = 0 ]; then
              echo "The Vercel preview build failed; nothing to alias."
              exit 0
            fi
            echo "Waiting for the Vercel preview build (attempt ${attempt}/${MAX_ATTEMPTS})..."
            sleep 12
          done

          if [ -z "$PREVIEW_URL" ]; then
            echo "Timed out waiting for the Vercel preview build (${MAX_ATTEMPTS} attempts)."
            echo "The next push to this PR will retry the alias."
            exit 0
          fi
          echo "PREVIEW_URL=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "SHA=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Assign preview.lqh2011.com to the deployment
        id: assign-alias
        if: steps.wait-preview.outputs.PREVIEW_URL != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL: ${{ steps.wait-preview.outputs.PREVIEW_URL }}
        run: |
          set -euo pipefail

          echo "Preview URL: $PREVIEW_URL"

          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "error=VERCEL_TOKEN secret is not set" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Resolve the Vercel scope (team slug, or the token owner's username
          # for personal accounts) via the Vercel API. The deployment URL alone
          # is ambiguous: team slugs are a trailing hyphen-delimited segment of
          # the hostname and cannot be parsed reliably. The API takes the
          # deployment hostname, not the full https:// URL.
          PREVIEW_HOST="${PREVIEW_URL#https://}"
          if ! SCOPE="$(curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${PREVIEW_HOST}" \
            | jq -r '.team.slug // empty')"; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "error=scope resolution failed - check the VERCEL_TOKEN" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -z "$SCOPE" ]; then
            if ! SCOPE="$(curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/user" \
              | jq -r '.user.username // empty')"; then
              echo "status=failure" >> "$GITHUB_OUTPUT"
              echo "error=scope resolution failed - check the VERCEL_TOKEN" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          if [ -z "$SCOPE" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "error=could not resolve the Vercel scope" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Resolved Vercel scope: $SCOPE"

          # Pin the CLI version - @latest is a mutable tag (supply-chain).
          if OUT="$(npx vercel@59.0.0 alias set "$PREVIEW_URL" preview.lqh2011.com \
            --token "$VERCEL_TOKEN" --scope "$SCOPE" 2>&1)"; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "alias=preview.lqh2011.com" >> "$GITHUB_OUTPUT"
            echo "Preview aliased to preview.lqh2011.com"
          else
            RC=$?
            ERR="$(printf '%s' "$OUT" | grep -iE 'error' | tail -1)"
            [ -z "$ERR" ] && ERR="$(printf '%s' "$OUT" | tail -1)"
            [ -z "$ERR" ] && ERR="vercel alias failed with exit code ${RC}"
            ERR="$(printf '%s' "$ERR" | sed 's/%/%25/g; s/\r//g')"
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "error=${ERR}" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Post alias status comment on the PR
        if: always() && steps.wait-preview.outputs.PREVIEW_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          STATUS: ${{ steps.assign-alias.outputs.status }}
          ERROR: ${{ steps.assign-alias.outputs.error }}
          PREVIEW_URL: ${{ steps.wait-preview.outputs.PREVIEW_URL }}
        run: |
          set -euo pipefail
          bash scripts/preview-status-comment.sh \
            "${{ github.event.pull_request.number }}" \
            "${STATUS}" "${ERROR}" "${PREVIEW_URL}"
