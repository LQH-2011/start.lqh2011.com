# CI: syntax gate + API unit tests + headless UI smoke tests.
# The page is a single self-contained index.html with no build step, so this
# is the regression net that catches what CodeRabbit (static review) can't:
# a broken inline script, a dead mode state machine, a history dropdown that
# stopped opening, a timer that no longer starts. Runs on every PR and on
# pushes to main (main is what GH Pages serves).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fastest gate: parse the inline <script> blocks so a syntax typo never
      # ships to production (the page has no bundler to catch it).
      - name: Inline JS syntax check
        run: npm run check

      # API handlers (auth/CORS/token/validation) with no database required.
      - name: API handler tests
        run: npm run test:api

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: UI smoke tests
        run: npm run test:ui

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
