# TEMPORARY diagnostic workflow — remove before merging.
# Isolates whether a GITHUB_TOKEN with pull-requests: write + issues: write
# can POST a new issue comment, independent of the deployment machinery.
name: Zz Perm Test

on:
  push:
    branches: [feat/ci-smoke-tests]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: POST a new issue comment to PR #45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "POSTing new comment to PR #45"
          gh api -X POST repos/LQH-2011/start.lqh2011.com/issues/45/comments \
            -f body='perm-test from GITHUB_TOKEN with pull-requests: write (push event)' \
            --jq '.id' || echo "POST FAILED with exit $?"
